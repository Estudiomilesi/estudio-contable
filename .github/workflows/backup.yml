name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup Database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "Error: DIRECT_URL secret is not set."
            exit 1
          fi
          
          DATE=$(date +'%Y-%m-%d')
          FILENAME="backup-estudio-$DATE.sql"
          
          echo "Iniciando backup..."
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace postgres:17 pg_dump "$DIRECT_URL" -F c -f "$FILENAME"
          echo "Backup completado: $FILENAME"

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-estudio-*.sql
          retention-days: 7
